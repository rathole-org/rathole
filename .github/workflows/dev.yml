name: Dev build (binaries + docker)

on:
  push:
    branches: [dev]

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: dev-latest
  IMAGE: ghcr.io/${{ github.repository }}

jobs:

  build-binaries:
    name: Build binaries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rathole
          # - name: windows-x86_64
          #   os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   bin: rathole.exe
          # - name: macos-x86_64
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   bin: rathole
          # - name: macos-arm64
          #   os: macos-14
          #   target: aarch64-apple-darwin
          #   bin: rathole
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          OUT="rathole-dev-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          tar -czf "${OUT}" -C dist .
          ls -lah "${OUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rathole-dev-${{ matrix.target }}.tar.gz

  docker:
    name: Build & push docker (dev)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Update rolling dev release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: git fetch --tags --force

      - name: Remember previous dev tag (if exists)
        id: prev
        shell: bash
        run: |
          set -e
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "sha=$(git rev-parse refs/tags/${RELEASE_TAG})" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi

      - name: Move dev tag to this commit
        shell: bash
        run: |
          set -euxo pipefail
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${RELEASE_TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create/Update GitHub Release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DIGEST: ${{ needs.docker.outputs.digest }}
        shell: bash
        run: |
          set -euxo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ -n "${{ steps.prev.outputs.sha }}" ]]; then
            CHANGES="$(git log --oneline --no-decorate ${{ steps.prev.outputs.sha }}..${GITHUB_SHA})"
          else
            CHANGES="$(git log --oneline --no-decorate -n 30)"
          fi

          NOTES="$(cat <<EOF
Automated build from branch \`dev\`.

- Commit: \`${GITHUB_SHA}\`
- Docker:
  - \`${IMAGE}:dev\` (moving)
  - \`${IMAGE}:dev-${SHORT_SHA}\` (pinned tag)
  - \`${IMAGE}@${DOCKER_DIGEST}\` (pinned digest)

Changes since previous dev build:
\`\`\`
${CHANGES}
\`\`\`
EOF
)"

          TITLE="Dev build (${SHORT_SHA})"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --prerelease --title "${TITLE}" --notes "${NOTES}"
          else
            gh release create "${RELEASE_TAG}" --prerelease --title "${TITLE}" --notes "${NOTES}"
          fi

          mapfile -t FILES < <(find dist -type f -name '*.tar.gz' -print)
          gh release upload "${RELEASE_TAG}" "${FILES[@]}" --clobber